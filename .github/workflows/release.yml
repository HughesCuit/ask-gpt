name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Pack smoke test + assert tarball contents
        run: |
          npm pack
          TARBALL=$(ls gpt-web-bridge-*.tgz | head -1)
          echo "Packed $TARBALL"
          LISTING=$(tar -tzf "$TARBALL")
          echo "$LISTING"
          require() {
            echo "$LISTING" | grep -E "$1" >/dev/null || {
              echo "MISSING from tarball: $1" >&2
              exit 1
            }
          }
          # npm pack paths are package/<file>
          require '^package/SKILL\.md$'
          require '^package/bin/web-gpt\.js$'
          require '^package/src/cli\.mjs$'
          require '^package/src/thinking-state\.mjs$'
          require '^package/selectors\.json$'
          require '^package/package\.json$'
          require '^package/README\.md$'
          require '^package/LICENSE$'
          # Extract and assert bin shebang + package name
          tar -xzf "$TARBALL" -C /tmp
          head -1 /tmp/package/bin/web-gpt.js | grep -q '#!/usr/bin/env node' || {
            echo 'bin/web-gpt.js missing node shebang' >&2
            exit 1
          }
          node -e "const p=require('/tmp/package/package.json'); if(p.name!=='gpt-web-bridge') process.exit(1)"
          mkdir -p /tmp/gpt-web-bridge-smoke
          npm install -g "./$TARBALL"
          gpt-web-bridge --version
          gpt-web-bridge --help
          gpt-web-bridge conversations --json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
